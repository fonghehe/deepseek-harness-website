name: Publish website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch }}

jobs:
  verify:
    # Visual fixtures use Ubuntu 24.04 font rendering; keep the runner release stable.
    runs-on: ubuntu-24.04
    container:
      # Keep this version aligned with Playwright in pnpm-lock.yaml.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 40
    permissions:
      contents: read
      pages: read
    env:
      CI: true
      E2E_PORT: 3101
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Read production Pages URL
        id: pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install dependencies, fonts and browsers
        run: node tests/tools/ci-pipeline.mjs setup
      - name: Verify the Node website, browsers and resource budgets
        run: node tests/tools/ci-pipeline.mjs node
        env:
          # configure-pages exports true for later steps; this verifies the Node server.
          GITHUB_PAGES: 'false'
      - name: Export, check and test the exact Pages artifact
        run: node tests/tools/ci-pipeline.mjs pages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      # out/index.html is the Next.js landing page; VitePress stays under out/docs/.
      - name: Upload the verified website and nested documentation
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          name: github-pages
          path: out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: quality-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  external-links:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - run: node tests/tools/check-links.mjs --strict
