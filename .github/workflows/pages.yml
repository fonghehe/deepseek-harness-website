name: Deploy verified website

on:
  workflow_call:

permissions:
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy the artifact produced by the successful verify job in this run.
      - name: Publish public website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
      - name: Show website and documentation URLs
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'Website: %s/\n\nDocumentation: %s/docs/\n' "${PAGE_URL%/}" "${PAGE_URL%/}" >> "$GITHUB_STEP_SUMMARY"
