name: Performance report
description: Report loading, interaction, animation or resource growth with reproducible evidence.
title: '[Performance] '
body:
  - type: textarea
    id: environment
    attributes:
      label: URL, build, locale, browser and device
      description: Include Node/Pages mode, viewport, motion preference, hardware/software GPU and network conditions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and measurements
      description: Attach profiler or Lighthouse evidence without private URLs or data. Distinguish repeated lab results from field observations.
    validations:
      required: true
